name: Manual offline handover checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tools/approved_sync/tests -v
      - run: python -m pytest -q backend/uat_tests/test_handover_shadow.py --confcutdir=backend/uat_tests
        env:
          PYTHONPATH: backend
      - run: npm ci && npx tsc --noEmit && npx vitest run --environment jsdom
        working-directory: frontend
